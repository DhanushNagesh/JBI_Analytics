name = "jan-telemetry"
main = "src/entry.py"
compatibility_date = "2026-09-01"
compatibility_flags = ["python_workers"]

[assets]
directory = "public"

[[d1_databases]]
binding = "DB"
database_name = "jan-telemetry"
database_id = "53f7e7b2-9a82-4d44-b71e-1a6edc5efb5c"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[vars]
# INFO events not stored in `events`. shot fires on every shot and would eat the D1 write budget.
DROP_INFO = "shot"
# Cloudflare Access: team domain (https://<team>.cloudflareaccess.com) and the application AUD tag.
# Both must be set in production; /api/* is refused without a valid Access JWT.
ACCESS_TEAM_DOMAIN = "https://autumn-paper-31fe.cloudflareaccess.com"
ACCESS_AUD = "41b7351b2075febc8510c50c62f6eca39857f29f86240a845bb86e32a24823d3"
# Set to "1" only in .dev.vars for local dev. Skips the Access JWT check.
DEV_NO_AUTH = ""
